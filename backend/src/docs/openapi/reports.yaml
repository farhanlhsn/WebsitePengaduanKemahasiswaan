paths:
  /v1/api/reports:
    get:
      tags: [Reports]
      summary: Daftar laporan untuk admin (paginasi kursor)
      description: Peran ADMIN atau SUPERADMIN. ADMIN tanpa penugasan kategori menerima daftar kosong.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: lastItemId
          in: query
          description: Kursor; isi dengan `pagination.lastItemId` dari halaman sebelumnya.
          schema: { type: integer }
        - name: search
          in: query
          description: Cari di judul dan deskripsi.
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReportStatus' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/Priority' }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: assignedToId
          in: query
          description: '`me` = ditugaskan ke saya, `unassigned` = belum ada petugas, atau ID admin.'
          schema: { type: string, example: me }
        - name: createdAt
          in: query
          description: Hanya laporan yang dibuat N hari terakhir.
          schema: { type: integer, minimum: 1, example: 7 }
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: Satu halaman laporan, terbaru lebih dulu.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data: { type: array, items: { $ref: '#/components/schemas/ReportListItem' } }
                          pagination: { $ref: '#/components/schemas/CursorPagination' }
              example:
                status: success
                statusCode: 200
                message: Success
                data:
                  data:
                    - id: 1
                      registrationNumber: SP/01/08/10/2026
                      title: AC ruang kuliah B.204 rusak sejak dua minggu
                      status: IN_PROGRESS
                      priority: HIGH
                      isAnonymous: false
                      userId: 2
                      category: { slug: sarana-dan-prasarana, name: Sarana dan Prasarana }
                      user: { id: 2, name: Budi Santoso, nim: '2110003001', email: budi.santoso@mahasiswa.bunghatta.ac.id }
                      closedAt: null
                      createdAt: '2026-10-08T08:09:22.356Z'
                  pagination: { totalItems: 1, itemsPerPage: 10, hasNextPage: false, lastItemId: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Reports]
      summary: Buat laporan baru
      description: >
        Hanya pengguna terverifikasi. `isAnonymous=true` hanya diterima untuk
        kategori dengan `allowAnonymous=true`. Prioritas awal mengikuti
        `defaultPriority` kategori. Lampiran diunggah terpisah lewat
        `POST /v1/api/reports/{reportId}/attachments`. Rate limit: 5 laporan per pengguna per jam.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, categoryId]
              properties:
                title: { type: string, minLength: 3 }
                description: { type: string, minLength: 10 }
                categoryId: { type: integer }
                isAnonymous: { type: boolean, default: false }
            example:
              title: AC ruang kuliah B.204 rusak sejak dua minggu
              description: Pendingin ruangan di ruang B.204 Gedung B tidak berfungsi sejak awal bulan.
              categoryId: 2
      responses:
        '201':
          description: Laporan dibuat dengan status PENDING.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Akun belum terverifikasi atau kategori tidak mengizinkan laporan anonim. }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/api/reports/user:
    get:
      tags: [Reports]
      summary: Daftar laporan milik pengguna yang login
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: lastItemId
          in: query
          description: Kursor; isi dengan `pagination.lastItemId` dari halaman sebelumnya.
          schema: { type: integer }
        - name: search
          in: query
          description: Cari di judul dan deskripsi (tidak peka huruf besar/kecil).
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReportStatus' }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: createdAt
          in: query
          description: Hanya laporan yang dibuat N hari terakhir.
          schema: { type: integer, minimum: 1, example: 7 }
      responses:
        '200':
          description: Satu halaman laporan milik sendiri (struktur sama dengan daftar admin).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data: { type: array, items: { $ref: '#/components/schemas/ReportListItem' } }
                          pagination: { $ref: '#/components/schemas/CursorPagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/api/reports/stats:
    get:
      tags: [Reports]
      summary: Jumlah laporan per status
      description: ADMIN/SUPERADMIN; untuk ADMIN dihitung dari kategori yang ditugaskan saja.
      responses:
        '200':
          description: Statistik.
          content:
            application/json:
              example:
                status: success
                statusCode: 200
                message: Report statistics retrieved successfully
                data: { total: 3, pending: 0, inReview: 0, inProgress: 1, resolved: 1, rejected: 1, canceled: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/api/reports/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Reports]
      summary: Detail laporan beserta lampiran dan pesan
      description: >
        Boleh diakses pemilik laporan, ADMIN dengan kategori terkait, atau
        SUPERADMIN. Membuka laporan anonim sebagai admin dicatat di audit log
        (`VIEW_ANONYMOUS`).
      parameters:
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: Detail laporan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Reports]
      summary: Edit laporan (pemilik, hanya saat PENDING)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 3 }
                description: { type: string, minLength: 10 }
                categoryId: { type: integer }
      responses:
        '200':
          description: Laporan diperbarui.
          content:
            application/json:
              example:
                status: success
                statusCode: 200
                message: Laporan berhasil diperbarui
                data: { id: 2, title: Nilai UTS Basis Data kelas A belum muncul di portal akademik, categoryId: 4, status: PENDING, registrationNumber: AK/01/08/10/2026 }
        '400': { description: 'Status bukan PENDING, tidak ada perubahan, atau validasi gagal.' }
        '403': { description: Bukan pemilik laporan atau akun belum terverifikasi. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Reports]
      summary: Batalkan (mahasiswa) atau soft-delete (admin) laporan
      description: >
        Mahasiswa: hanya laporan miliknya yang masih PENDING, dan aksinya
        mengubah status menjadi CANCELED (pesan "Laporan berhasil dibatalkan").
        Admin: soft delete (bisa dipulihkan) untuk laporan dalam cakupannya.
      responses:
        '200': { description: Laporan dibatalkan atau dihapus sementara. }
        '400': { description: Mahasiswa mencoba menghapus laporan yang tidak lagi PENDING. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/api/reports/{id}/status:
    patch:
      tags: [Reports]
      summary: Ubah status laporan (admin)
      description: >
        Mengikuti state machine pada skema `ReportStatus`. `reason` wajib untuk
        REJECTED dan CANCELED dan akan ditampilkan ke pelapor. Pelapor
        mendapat email notifikasi bila SMTP aktif.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ReportStatus' }
                reason: { type: string, minLength: 3 }
            examples:
              tinjau: { value: { status: IN_REVIEW } }
              tolak: { value: { status: REJECTED, reason: Jadwal praktikum sudah direvisi oleh prodi; silakan cek jadwal terbaru di portal. } }
      responses:
        '200':
          description: Status diperbarui.
          content:
            application/json:
              example:
                status: success
                statusCode: 200
                message: Status updated
                data: { id: 1, status: IN_REVIEW, closedAt: null, rejectedReason: null, canceledReason: null, userId: 2, title: AC ruang kuliah B.204 rusak sejak dua minggu, registrationNumber: SP/01/08/10/2026 }
        '400':
          description: Transisi tidak diizinkan atau alasan tidak diisi.
          content:
            application/json:
              example: { status: error, message: 'Tidak bisa mengubah status dari RESOLVED ke PENDING. Transisi yang diizinkan: IN_REVIEW' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/api/reports/{id}/priority:
    patch:
      tags: [Reports]
      summary: Ubah prioritas laporan (admin)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: { $ref: '#/components/schemas/Priority' }
      responses:
        '200':
          description: Prioritas diperbarui.
          content:
            application/json:
              example: { status: success, statusCode: 200, message: Priority updated, data: { id: 1, priority: HIGH, title: AC ruang kuliah B.204 rusak sejak dua minggu, registrationNumber: SP/01/08/10/2026 } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/api/reports/{id}/assign:
    patch:
      tags: [Reports]
      summary: Tetapkan atau lepas petugas laporan (admin)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignedToId: { type: integer, nullable: true, description: ID admin; `null` untuk melepas petugas. }
      responses:
        '200':
          description: Petugas diperbarui ("Report assigned" atau "Report unassigned").
          content:
            application/json:
              example:
                status: success
                statusCode: 200
                message: Report assigned
                data: { id: 1, assignedToId: 4, title: AC ruang kuliah B.204 rusak sejak dua minggu, registrationNumber: SP/01/08/10/2026, assignedTo: { id: 4, name: Rina Kurniawati, email: rina.kurnia@bunghatta.ac.id } }
        '400': { description: Petugas bukan admin atau tidak punya akses ke kategori laporan. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/api/reports/{id}/restore:
    post:
      tags: [Reports]
      summary: Pulihkan laporan yang di-soft-delete (admin dalam cakupan)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Laporan dipulihkan ("Report restored"). }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/api/reports/{id}/permanent:
    delete:
      tags: [Reports]
      summary: Hapus laporan permanen (SUPERADMIN)
      description: Menghapus laporan beserta lampiran dan pesannya. Tidak bisa dibatalkan.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Laporan dihapus permanen. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/api/reports/{reportId}/attachments:
    post:
      tags: [Reports]
      summary: Unggah lampiran laporan
      description: >
        Pemilik laporan (hanya saat PENDING) atau admin dalam cakupan. Maks. 10
        berkas, 5 MB per berkas; JPEG, PNG, WebP, PDF, DOC, DOCX. Gambar
        dikompresi otomatis. Rate limit: 10 unggahan per menit.
      parameters:
        - $ref: '#/components/parameters/ReportIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Lampiran tersimpan (catatan, respons ini tidak memakai bungkus standar).
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        '400': { description: 'Berkas terlalu besar, tipe tidak diizinkan, atau laporan tidak lagi PENDING.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
