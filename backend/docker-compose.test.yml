version: "3.9"

# Ephemeral PostgreSQL for integration tests (BE-3).
#
# Usage:
#   npm run test:integration         # auto-starts/stops via setup
#   docker compose -f docker-compose.test.yml up -d  # manual up
#   docker compose -f docker-compose.test.yml down -v # manual down + drop volume
#
# We bind the container port to 55432 on host to avoid colliding with any
# locally-installed Postgres on 5432. The test setup helper looks for
# TEST_DATABASE_URL using port 55432 by default.

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: pengaduan-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: pengaduan_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d pengaduan_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      # Keep data in RAM for speed — perfect for tests, gone on container stop.
      - /var/lib/postgresql/data
