name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Audit (high severity)
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: npx prisma migrate deploy

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          JWT_SECRET: ci-test-secret-minimum-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-chars
          NODE_ENV: test
        run: npm test -- --runInBand

      - name: Start integration services
        working-directory: backend
        run: npm run test:integration:up

      - name: Run integration tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-minimum-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-chars
          NODE_ENV: test
        run: npm run test:integration

      - name: Stop integration services
        if: always()
        working-directory: backend
        run: npm run test:integration:down

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit (high severity)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Install Playwright browsers
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ./.playwright-browsers
        run: npx playwright install chromium --with-deps

      - name: Run component tests
        working-directory: frontend
        run: npm run test:component

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:6060/v1/api
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose config
          docker compose -f docker-compose.prod.yml config

      - name: Build images
        run: |
          docker compose build
          docker compose -f docker-compose.prod.yml build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ./.playwright-browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: true
          E2E_DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          JWT_SECRET: ci-e2e-secret-minimum-32-characters
          JWT_REFRESH_SECRET: ci-e2e-refresh-secret-min-32-ch
        run: npm run test:e2e
